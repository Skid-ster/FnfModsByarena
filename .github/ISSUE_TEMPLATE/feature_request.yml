name: Feature request
description: Suggest a chart tweak, new scare event, extra song...
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Charting, Story events (HScript), Art, Audio, Docs / tooling]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Extra notes
      description: Remember that charts and audio are generated by `tools/`, so chart ideas are best expressed as changes to `tools/song_layout.py`.
