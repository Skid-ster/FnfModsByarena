name: Build & Validate

on:
  push:
    branches: ["main", "arena/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --upgrade pip pillow numpy soundfile

      - name: Validate charts, configs, atlases and audio
        run: python3 tools/validate_mod.py

      - name: Test shader validator regressions
        run: python3 tools/test_shader_validation.py

      - name: Compile shader sources with minimal Flixel interface
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools
          python3 tools/test_glsl_compile.py

      - name: Test battle presentation regressions
        run: |
          python3 tools/test_polish.py
          python3 tools/test_battle_visuals.py
          python3 tools/test_stage_bounds.py
          python3 tools/make_stage_preview.py

      - name: Test music rendering regressions
        run: python3 tools/test_music.py

      - name: Audit the mix and the chart style
        run: python3 tools/audit_songs.py --strict

      # Two claims that used to be labels rather than properties of the shipped
      # build: that the melodies are written music, and that the songs actually
      # get scarier. Both are measured on the files in the repo.
      - name: Measure melody-band mix balance
        run: python3 tools/mix_report.py --strict

      - name: Check decoded instrumental and vocal sums
        run: python3 tools/check_stem_mix.py

      - name: Measure the melodies
        run: python3 tools/melody_report.py

      - name: Measure the dread ladder
        run: python3 tools/dread_report.py --strict

      - name: Package mod archive
        run: python3 tools/package_mod.py

      - name: Model Freeplay lookups on the built zip
        run: python3 tools/check_freeplay_zip.py

      - name: Upload packaged mod
        uses: actions/upload-artifact@v4
        with:
          name: SuperScaryTrollge-mod
          path: dist/*.zip
          if-no-files-found: error

  charts-in-sync:
    name: Charts match the generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --upgrade pip numpy soundfile pillow

      - name: Regenerate charts and cutscenes
        run: |
          python3 tools/make_chart.py
          python3 tools/make_cutscenes.py

      - name: Fail if the committed charts or cutscenes drifted
        run: |
          if ! git diff --exit-code -- mods/TrollgeMod/songs mods/TrollgeMod/images/ui; then
            echo "::error::Generated files are out of date. Run 'python3 tools/make_chart.py' and 'python3 tools/make_cutscenes.py' and commit the result."
            exit 1
          fi

  release:
    name: Publish release
    needs: [validate, charts-in-sync]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Package mod archive
        run: python3 tools/package_mod.py

      # Keep the testing limitations and full notes intact on this release.
      - name: Attach v3.8.0 testing archives
        if: github.ref == 'refs/tags/v3.8.0'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TrollgeMod.zip
            dist/SuperScaryTrollge-v3.8.0.zip
          body_path: docs/releases/v3.8.0.md
          fail_on_unmatched_files: true

      - name: Attach v3.9.0 release archives
        if: github.ref == 'refs/tags/v3.9.0'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TrollgeMod.zip
            dist/SuperScaryTrollge-v3.9.0.zip
          body_path: docs/releases/v3.9.0.md
          fail_on_unmatched_files: true

      - name: Attach v4.0.0 testing archives
        if: github.ref == 'refs/tags/v4.0.0'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TrollgeMod.zip
            dist/SuperScaryTrollge-v4.0.0.zip
          body_path: docs/releases/v4.0.0.md
          prerelease: true
          fail_on_unmatched_files: true

      - name: Attach v4.1.0-rc1 testing archives
        if: github.ref == 'refs/tags/v4.1.0-rc1'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TrollgeMod.zip
            dist/SuperScaryTrollge-v4.1.0-rc1.zip
          body_path: docs/releases/v4.1.0-rc1.md
          prerelease: true
          fail_on_unmatched_files: true

      - name: Create release
        if: github.ref != 'refs/tags/v3.8.0' && github.ref != 'refs/tags/v3.9.0' && github.ref != 'refs/tags/v4.0.0' && github.ref != 'refs/tags/v4.1.0-rc1'
        uses: softprops/action-gh-release@v2
        with:
          # TrollgeMod.zip is the installable one: Codename names a mod after the
          # file it loads, and freeplay looks for LIB_<thatName>.txt. The
          # versioned zip is the same bytes under a human-readable name.
          files: |
            dist/TrollgeMod.zip
            dist/SuperScaryTrollge-*.zip
          generate_release_notes: true
          body: |
            ## Install

            1. Download **`TrollgeMod.zip`** below.
            2. Drop it into Codename Engine's `mods/` folder — or extract it so you get `mods/TrollgeMod/`.
            3. Launch the engine, open **Mods**, pick **TrollgeMod**.

            Install from **`TrollgeMod.zip`** to match the literal `LIB_TrollgeMod`
            compatibility lists. The versioned archive contains the same files.
            Freeplay behavior can vary with the engine build and library name.

            Requires [Codename Engine](https://github.com/CodenameCrew/CodenameEngine) — this is not a Psych or
            YoshiCrafter mod.
# Release build trigger
