[Common]
NAME=Super Scary Trollge
DESCRIPTION=Five songs of escalating Trollge horror (2/10 to 10/10): Trolling, It's Getting Dark, Don't Look Back, Super Scary Trollge and The Incident. Custom arrow skins, splashes, HUD, camera work and per-character note voices.
AUTHORS=Skid-ster
VERSION=3.4.0

[Flags]
; Every menu in the game plays the mod's music box theme instead of freakyMenu.
; CoolUtil.playMenuSong() -> Paths.music(Flags.DEFAULT_MENU_MUSIC) -> music/trollgeMenu.ogg
DEFAULT_MENU_MUSIC="trollgeMenu"

[StateRedirects]
; Launch straight into the mod's own menu instead of the vanilla "press enter"
; title screen. The value must be the full class path: GlobalScript's
; preStateSwitch hook resolves it with Type.resolveClass and only falls back to
; a ModState script (data/states/<name>/LIB_<mod>.hx) when that lookup fails.
; Prefer landing in the song picker? Change this to "funkin.menus.FreeplayState".
TitleState="funkin.menus.MainMenuState"
